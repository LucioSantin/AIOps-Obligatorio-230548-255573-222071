apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-cadvisor
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy"]
    verbs: ["get", "list"]
  # Para descubrir los pods de backend y scrapear cada réplica
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
