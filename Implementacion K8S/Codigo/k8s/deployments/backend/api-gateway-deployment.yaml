apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-api-gateway
  namespace: pharmago
spec:
  # 2 réplicas para que, mientras un pod se recrea, el otro siga atendiendo
  replicas: 2
  # Rolling update sin downtime: primero se levanta el pod nuevo y solo cuando
  # está READY se baja el viejo (nunca hay 0 réplicas disponibles).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pharmago-api-gateway
  template:
    metadata:
      labels:
        app: pharmago-api-gateway
        tier: backend
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [backend, all]
        # Ningún OTRO microservicio de backend puede compartir nodo con este.
        # Se excluye el propio app para que, durante un rolling update, la
        # versión nueva pueda convivir momentáneamente con la vieja.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: tier
                operator: In
                values: [backend]
              - key: app
                operator: NotIn
                values: [pharmago-api-gateway]
            topologyKey: kubernetes.io/hostname
        # Todas las réplicas de este servicio van al mismo nodo. Con 3 nodos y 3 servicios,
        # separarlas le quitaría el nodo a otro microservicio y lo dejaría en Pending.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: pharmago-api-gateway
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
      - name: pharmago-api-gateway
        image: pharmago-api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=pharmago"
        # Recursos reducidos para nodos ~5GB (proyecto docente)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
            ephemeral-storage: "100Mi"
          limits:
            memory: "384Mi"
            cpu: "500m"
            ephemeral-storage: "250Mi"
        # Al terminar, esperar a que el Service deje de enrutar a este pod
        # antes de que el proceso reciba SIGTERM (evita requests cortados).
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "10"]
        # La startupProbe cubre el arranque (hasta 60 s), por eso las otras no tienen initialDelay
        startupProbe:
          httpGet:
            path: /health/live
            port: 80
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        # Saca el pod del Service tras ~4 s sin responder
        readinessProbe:
          httpGet:
            path: /health/live
            port: 80
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 2
        # Reinicia el contenedor tras ~15 s colgado
        livenessProbe:
          httpGet:
            path: /health/live
            port: 80
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
          # Un proceso colgado no atiende SIGTERM, no tiene sentido esperarle los 30 s del pod
          terminationGracePeriodSeconds: 5
