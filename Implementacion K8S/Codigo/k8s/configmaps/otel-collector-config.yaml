apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: pharmago
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
      prometheus:
        config:
          global:
            scrape_interval: 10s
          scrape_configs:
            - job_name: 'node-exporter'
              metrics_path: /metrics
              kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [pharmago]
              relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                regex: node-exporter
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
              metric_relabel_configs:
              - source_labels: [__name__]
                regex: node_(cpu_seconds_total|memory_MemAvailable_bytes|memory_MemTotal_bytes|filesystem_avail_bytes|filesystem_size_bytes|network_receive_bytes_total|network_transmit_bytes_total)
                action: keep

            - job_name: 'kubernetes-cadvisor'
              kubernetes_sd_configs:
              - role: node
              scheme: https
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              relabel_configs:
              - action: labelmap
                regex: __meta_kubernetes_node_label_(.+)
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [__meta_kubernetes_node_name]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor
              - source_labels: [__meta_kubernetes_node_name]
                target_label: node
              - replacement: kubernetes-cadvisor
                target_label: job
              metric_relabel_configs:
              - source_labels: [__name__]
                regex: container_(cpu_usage_seconds_total|cpu_cfs_throttled_seconds_total|spec_cpu_quota|memory_working_set_bytes|spec_memory_limit_bytes|network_receive_bytes_total|network_transmit_bytes_total|fs_writes_bytes_total)
                action: keep
          
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
      batch:
        timeout: 2s

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        resource_to_telemetry_conversion:
          enabled: true
        metric_expiration: 1m
        send_timestamps: true
      otlp/jaeger:
        endpoint: "jaeger:4317"
        tls:
          insecure: true

    service:
      pipelines:
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger]

