apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pharmago
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'otlp-collector'
        honor_labels: true
        metrics_path: /metrics
        static_configs:
          - targets: ['otlp-collector:8889']
      
      - job_name: 'users-service'
        metrics_path: /metrics
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: [pharmago]
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: pharmago-users-service
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "80"
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        metric_relabel_configs:
        - source_labels: [__name__]
          regex: '.*'
          action: drop

      - job_name: 'pharmacy-service'
        metrics_path: /metrics
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: [pharmago]
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: pharmago-pharmacy-service
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "80"
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        metric_relabel_configs:
        - source_labels: [__name__]
          regex: '.*'
          action: drop

      - job_name: 'api-gateway'
        metrics_path: /metrics
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: [pharmago]
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: pharmago-api-gateway
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "80"
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        metric_relabel_configs:
        - source_labels: [__name__]
          regex: '.*'
          action: drop